<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ליביס – מערכת ניהול ייצור חכמה</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-teal: #008291;
            --brand-gold: #c8941a;
            --brand-gold-light: #fdf5e0;
            --bg-cream: #fdfaf2;
            --white: #ffffff;
            --shadow: 0 10px 30px rgba(0, 130, 145, 0.1);
        }

        body { font-family: 'Heebo', sans-serif; background-color: var(--bg-cream); margin: 0; padding: 0; color: #333; }
        
        /* Header */
        .header { text-align: center; background: var(--brand-teal); padding: 30px; border-bottom: 4px solid var(--brand-gold); color: white; }
        .header img { height: 110px; width: auto; margin-bottom: 10px; }
        
        /* Navigation */
        .nav-tabs { display: flex; justify-content: center; gap: 15px; margin: 25px 0; }
        .tab-btn { padding: 12px 25px; border: none; background: #e0e0e0; border-radius: 50px; cursor: pointer; font-weight: bold; font-family: 'Heebo'; transition: 0.3s; }
        .tab-btn.active { background: var(--brand-teal); color: white; box-shadow: var(--shadow); }

        .container { max-width: 1000px; margin: 0 auto; padding: 0 20px 100px 20px; }
        .content-section { display: none; }
        .content-section.active { display: block; }

        /* Cards & Tables */
        .card { background: var(--white); padding: 25px; border-radius: 20px; box-shadow: var(--shadow); margin-bottom: 25px; border: 1px solid var(--brand-gold-light); }
        h2 { color: var(--brand-teal); margin-top: 0; border-bottom: 2px solid var(--brand-gold-light); padding-bottom: 10px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { text-align: right; background: var(--brand-gold-light); color: var(--brand-teal); padding: 12px; }
        td { padding: 10px; border-bottom: 1px solid #eee; }
        
        input, select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 8px; font-family: 'Heebo'; }
        .btn-add { background: var(--brand-teal); color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; margin-top: 10px; }
        .btn-del { background: #ff4d4d; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }

        /* Recipe Breakdown */
        .recipe-area { background: #f9f9f9; padding: 15px; border-radius: 12px; margin-top: 10px; border-right: 4px solid var(--brand-gold); }
        .stats { display: flex; gap: 20px; margin-top: 15px; font-weight: bold; font-size: 0.9em; }
        .profit-good { color: #27ae60; }

        /* Order Form */
        .order-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #eee; }
        .qty-input { width: 60px; text-align: center; }

        /* Floating Summary */
        .summary-bar { position: fixed; bottom: 0; width: 100%; background: var(--brand-teal); color: white; padding: 20px; display: flex; justify-content: space-around; align-items: center; box-shadow: 0 -5px 20px rgba(0,0,0,0.2); }
        .total-amount { font-size: 28px; font-weight: 900; color: var(--brand-gold); }

        @media print { .nav-tabs, .btn-add, .btn-del, .header { display: none !important; } .content-section { display: block !important; } }
    </style>
</head>
<body>

<div class="header">
    <img src="libis-logo.png" alt="ליביס">
    <div class="subtitle">מערכת ניהול ייצור ועלויות חכמה</div>
</div>

<div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('tab-raw')">1. חומרי גלם</button>
    <button class="tab-btn" onclick="switchTab('tab-recipes')">2. ניהול מנות ומתכונים</button>
    <button class="tab-btn" onclick="switchTab('tab-order')">3. טופס הזמנה</button>
</div>

<div class="container">
    
    <div id="tab-raw" class="content-section active">
        <div class="card">
            <h2>מחירון חומרי גלם בסיסי</h2>
            <table>
                <thead>
                    <tr><th>חומר גלם</th><th>יחידה</th><th>מחיר (₪)</th><th></th></tr>
                </thead>
                <tbody id="raw-materials-list"></tbody>
            </table>
            <button class="btn-add" onclick="addRow('raw')">+ הוסף חומר חדש</button>
        </div>
    </div>

    <div id="tab-recipes" class="content-section">
        <div id="products-list"></div>
        <button class="btn-add" onclick="addRow('product')" style="width:100%; padding:20px; font-size:1.2em;">+ הוסף מנה חדשה לתפריט</button>
    </div>

    <div id="tab-order" class="content-section">
        <div class="card">
            <h2>יצירת הזמנה חדשה</h2>
            <div id="order-items-list"></div>
        </div>
    </div>

</div>

<div class="summary-bar">
    <div>סה"כ לתשלום: <span class="total-amount" id="order-total">0 ₪</span></div>
    <button onclick="window.print()" style="background:var(--brand-gold); color:white; border:none; padding:12px 25px; border-radius:50px; font-weight:bold; cursor:pointer;">הדפס הזמנה</button>
</div>

<script>
    // נתונים ראשוניים - מוזנים לפי ה-PDF שלך
    let state = JSON.parse(localStorage.getItem('libis_pro_state')) || {
        raw: [
            { id: 1, name: "פסטה", unit: "קילו", price: 12 },
            { id: 2, name: "שמנת לבישול", unit: "ליטר", price: 21 },
            { id: 3, name: "פטריות טריות", unit: "סלסלה", price: 15 },
            { id: 4, name: "מגש אירוח + אריזה", unit: "יחידה", price: 7 }
        ],
        products: [
            { id: 101, name: "פסטה ברוטב שמנת פטריות", price: 180, ingredients: [{id: 1, qty: 1}, {id: 2, qty: 0.5}, {id: 4, qty: 1}] },
            { id: 102, name: "פסטה ברוטב רוזה", price: 180, ingredients: [{id: 1, qty: 1}, {id: 4, qty: 1}] },
            { id: 103, name: "24 מיני קישים מלוחים", price: 200, ingredients: [{id: 4, qty: 1}] },
            { id: 104, name: "סלט יווני עשיר", price: 180, ingredients: [{id: 4, qty: 1}] }
        ]
    };

    function save() {
        localStorage.setItem('libis_pro_state', JSON.stringify(state));
        render();
    }

    function switchTab(tabId) {
        document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.target.classList.add('active');
    }

    function addRow(type, productId = null) {
        if (type === 'raw') {
            state.raw.push({ id: Date.now(), name: "חומר חדש", unit: "יחידה", price: 0 });
        } else if (type === 'product') {
            state.products.push({ id: Date.now(), name: "מנה חדשה", price: 0, ingredients: [] });
        } else if (type === 'ingredient') {
            const p = state.products.find(x => x.id === productId);
            p.ingredients.push({ id: state.raw[0].id, qty: 0 });
        }
        save();
    }

    function deleteRow(type, id, subId = null) {
        if (type === 'raw') state.raw = state.raw.filter(x => x.id !== id);
        if (type === 'product') state.products = state.products.filter(x => x.id !== id);
        if (type === 'ingredient') {
            const p = state.products.find(x => x.id === id);
            p.ingredients.splice(subId, 1);
        }
        save();
    }

    function update(type, id, field, val, subIdx = null) {
        if (type === 'raw') {
            const item = state.raw.find(x => x.id === id);
            item[field] = field === 'price' ? parseFloat(val) || 0 : val;
        }
        if (type === 'product') {
            const item = state.products.find(x => x.id === id);
            item[field] = field === 'price' ? parseFloat(val) || 0 : val;
        }
        if (type === 'ingredient') {
            const p = state.products.find(x => x.id === id);
            p.ingredients[subIdx][field] = parseFloat(val) || 0;
        }
        save();
    }

    function render() {
        // רנדור חומרי גלם
        const rawList = document.getElementById('raw-materials-list');
        rawList.innerHTML = state.raw.map(m => `
            <tr>
                <td><input type="text" value="${m.name}" onchange="update('raw', ${m.id}, 'name', this.value)"></td>
                <td><input type="text" value="${m.unit}" onchange="update('raw', ${m.id}, 'unit', this.value)"></td>
                <td><input type="number" value="${m.price}" onchange="update('raw', ${m.id}, 'price', this.value)"></td>
                <td><button class="btn-del" onclick="deleteRow('raw', ${m.id})">✖</button></td>
            </tr>
        `).join('');

        // רנדור מוצרים ומתכונים
        const prodList = document.getElementById('products-list');
        prodList.innerHTML = state.products.map(p => {
            let cost = 0;
            p.ingredients.forEach(ing => {
                const r = state.raw.find(x => x.id == ing.id);
                if (r) cost += r.price * ing.qty;
            });
            const profit = p.price - cost;

            return `
                <div class="card">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <input type="text" style="font-weight:bold; font-size:1.2em; border:none;" value="${p.name}" onchange="update('product', ${p.id}, 'name', this.value)">
                        <div style="width:150px">מכירה: <input type="number" value="${p.price}" onchange="update('product', ${p.id}, 'price', this.value)"></div>
                    </div>
                    
                    <div class="recipe-area">
                        <strong>פירוט עלויות ייצור (מתכון):</strong>
                        <table>
                            ${p.ingredients.map((ing, idx) => `
                                <tr>
                                    <td>
                                        <select onchange="update('ingredient', ${p.id}, 'id', this.value, ${idx})">
                                            ${state.raw.map(r => `<option value="${r.id}" ${r.id == ing.id ? 'selected' : ''}>${r.name}</option>`).join('')}
                                        </select>
                                    </td>
                                    <td><input type="number" value="${ing.qty}" onchange="update('ingredient', ${p.id}, 'qty', this.value, ${idx})"></td>
                                    <td>${((state.raw.find(x => x.id == ing.id)?.price || 0) * ing.qty).toFixed(2)} ₪</td>
                                    <td><button class="btn-del" onclick="deleteRow('ingredient', ${p.id}, ${idx})">✖</button></td>
                                </tr>
                            `).join('')}
                        </table>
                        <button class="btn-add" onclick="addRow('ingredient', ${p.id})" style="font-size:0.8em;">+ הוסף מרכיב</button>
                        <div class="stats">
                            <span>עלות ייצור: ${cost.toFixed(2)} ₪</span>
                            <span class="profit-good">רווח נקי: ${profit.toFixed(2)} ₪</span>
                        </div>
                    </div>
                </div>
            `;
        }).join('');

        // רנדור טופס הזמנה
        const orderList = document.getElementById('order-items-list');
        orderList.innerHTML = state.products.map(p => `
            <div class="order-item">
                <span>${p.name} <strong>(${p.price} ₪)</strong></span>
                <input type="number" class="qty-input" placeholder="0" oninput="calcOrder()">
            </div>
        `).join('');
    }

    function calcOrder() {
        let total = 0;
        const qtys = document.querySelectorAll('.qty-input');
        state.products.forEach((p, idx) => {
            const q = parseFloat(qtys[idx].value) || 0;
            total += q * p.price;
        });
        document.getElementById('order-total').innerText = total.toFixed(2) + ' ₪';
    }

    window.onload = render;
</script>

</body>
</html>
