<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ליביס – ניהול עלויות בוטיק</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-teal: #008291; /* הטורקיז מהלוגו */
            --brand-gold: #c8941a; /* הזהב מהלוגו */
            --brand-gold-light: #fdf5e0;
            --bg-cream: #fdfaf2; /* רקע שמנת מהתפריט */
            --white: #ffffff;
            --text-dark: #1a1a1a;
            --shadow: 0 10px 30px rgba(0, 130, 145, 0.1);
        }

        body {
            font-family: 'Heebo', sans-serif;
            background-color: var(--bg-cream);
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* עיצוב הלוגו בראש העמוד */
        .header {
            text-align: center;
            margin-bottom: 40px;
            background: var(--brand-teal);
            padding: 30px;
            border-radius: 0 0 50px 50px;
            width: 100%;
            max-width: 800px;
            box-shadow: var(--shadow);
            border-bottom: 4px solid var(--brand-gold);
        }

        .logo-text {
            color: var(--brand-gold);
            font-size: 50px;
            font-weight: 900;
            margin: 0;
            line-height: 1;
        }

        .subtitle {
            color: white;
            font-size: 18px;
            margin-top: 5px;
            letter-spacing: 2px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--white);
            padding: 30px;
            border-radius: 30px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(0, 130, 145, 0.1);
            margin-bottom: 30px;
        }

        h2 {
            color: var(--brand-teal);
            border-bottom: 2px solid var(--brand-gold-light);
            padding-bottom: 10px;
            margin-top: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h2::before {
            content: '✿';
            color: var(--brand-gold);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background-color: var(--brand-teal);
            color: white;
            padding: 12px;
            text-align: right;
            border-radius: 0;
        }

        th:first-child { border-radius: 0 15px 0 0; }
        th:last-child { border-radius: 15px 0 0 0; }

        td {
            padding: 12px;
            border-bottom: 1px solid var(--brand-gold-light);
        }

        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-family: 'Heebo';
            font-size: 16px;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--brand-gold);
            background-color: var(--brand-gold-light);
        }

        .row-total {
            background-color: var(--brand-gold-light);
            font-weight: bold;
            color: var(--brand-teal);
        }

        .save-status {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: var(--brand-teal);
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 14px;
            display: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .add-btn {
            background: var(--brand-gold);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
            transition: 0.3s;
        }

        .add-btn:hover {
            background: var(--brand-teal);
        }

        .summary-card {
            background: var(--brand-teal);
            color: white;
            padding: 20px;
            border-radius: 20px;
            margin-top: 20px;
            display: flex;
            justify-content: space-around;
            text-align: center;
        }

        .summary-item span {
            display: block;
            font-size: 24px;
            font-weight: 900;
            color: var(--brand-gold);
        }

        /* איור קטן בצד לעיצוב */
        .floral-deco {
            position: absolute;
            top: 10px;
            right: 10px;
            opacity: 0.1;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 class="logo-text">ליביס</h1>
        <div class="subtitle">קייטרינג חלבי בוטיק</div>
    </div>

    <div class="container">
        <h2>עדכון עלויות חומרי גלם</h2>
        <p>הגדר כאן את מחירי הבסיס של החומרים שלך. המידע נשמר אוטומטית.</p>
        <table id="materialsTable">
            <thead>
                <tr>
                    <th>שם החומר</th>
                    <th>מחיר ליחידה (₪)</th>
                    <th>פעולה</th>
                </tr>
            </thead>
            <tbody id="materialsBody">
                </tbody>
        </table>
        <button class="add-btn" onclick="addMaterial()">+ הוסף חומר גלם</button>
    </div>

    <div class="container">
        <h2>חישוב עלות מוצר סופי</h2>
        <table id="calculatorTable">
            <thead>
                <tr>
                    <th>חומר גלם</th>
                    <th>כמות בשימוש</th>
                    <th>עלות יחסית</th>
                </tr>
            </thead>
            <tbody id="calculatorBody">
                </tbody>
        </table>
        
        <div class="summary-card">
            <div class="summary-item">
                סה"כ עלות ייצור
                <span id="totalProductionCost">0
