<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ליביס – מערכת ניהול פרימיום</title>
    <link rel="icon" type="image/png" href="libis-logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --teal: #008291;
            --teal-light: #e0f2f4;
            --gold: #c8941a;
            --gold-light: #fdf5e0;
            --bg: #f8f9fa;
            --white: #ffffff;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            --radius: 12px;
        }

        body { font-family: 'Heebo', sans-serif; background-color: var(--bg); margin: 0; padding: 0; color: #333; line-height: 1.6; }

        /* ===== מסך כניסה ===== */
        #login-overlay {
            position: fixed; inset: 0; background: linear-gradient(135deg, #005f6b 0%, #008291 50%, #00a8b8 100%);
            z-index: 9999; display: flex; align-items: center; justify-content: center;
        }
        #login-overlay.hidden { display: none; }
        .login-box {
            background: white; border-radius: 20px; padding: 40px 32px; width: calc(100% - 40px); max-width: 380px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3); text-align: center;
        }
        .login-box img { height: 80px; margin-bottom: 20px; }
        .login-box h2 { color: var(--teal); font-size: 22px; margin: 0 0 6px; font-weight: 900; }
        .login-box p { color: #888; font-size: 13px; margin: 0 0 28px; }
        .login-field { position: relative; margin-bottom: 16px; text-align: right; }
        .login-field label { display: block; font-size: 13px; font-weight: 700; color: #555; margin-bottom: 6px; }
        .login-field input {
            width: 100%; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 10px;
            font-family: 'Heebo'; font-size: 15px; box-sizing: border-box; transition: 0.2s; outline: none;
        }
        .login-field input:focus { border-color: var(--teal); }
        .login-btn {
            width: 100%; padding: 14px; background: var(--teal); color: white; border: none;
            border-radius: 50px; font-family: 'Heebo'; font-size: 16px; font-weight: 900;
            cursor: pointer; transition: 0.2s; margin-top: 8px;
        }
        .login-btn:hover { background: #006b78; }
        .login-error { color: #e53935; font-size: 13px; margin-top: 10px; min-height: 18px; font-weight: 700; }
        #app-content { display: none; }
        .header { text-align: center; background: var(--teal); padding: 18px 25px; border-bottom: 5px solid var(--gold); }
        .header-logo { height: 65px; display: block; margin: 0 auto; }
        .header-text { display: none; color: white; font-size: 22px; font-weight: 900; letter-spacing: 1px; }

        .nav-main { display: flex; justify-content: center; align-items: center; gap: 8px; padding: 12px 20px; background: white; position: sticky; top: 0; z-index: 1000; box-shadow: 0 2px 12px rgba(0,0,0,0.08); flex-wrap: wrap; }
        .nav-btn { padding: 10px 22px; border: none; border-radius: 50px; cursor: pointer; font-weight: 700; background: #f0f0f0; color: #555; transition: 0.25s; font-family: 'Heebo'; font-size: 14px; white-space: nowrap; }
        .nav-btn:hover { background: #e0e0e0; }
        .nav-btn.active { background: var(--teal); color: white; box-shadow: 0 3px 10px rgba(0,130,145,0.3); }

        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px 150px 20px; display: none; }
        .container.active { display: block; }

        .card { background: white; padding: 25px; border-radius: var(--radius); margin-bottom: 30px; box-shadow: var(--shadow); }
        .order-info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .order-info-grid input { padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-family: 'Heebo'; }

        .bank-grid { display: flex; flex-direction: column; }
        .bank-item-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid #f3f3f3; }
        .bank-item-row:last-child { border-bottom: none; }
        .bank-input { border: 1px solid transparent; padding: 4px 7px; border-radius: 6px; font-family: 'Heebo'; font-size: 13px; background: transparent; transition: 0.15s; }
        .bank-input:hover, .bank-input:focus { border-color: #ddd; background: #f9f9f9; outline: none; }
        .bank-input-name { flex: 1; }
        .bank-input-unit { width: 55px; text-align: center; }
        .bank-input-price { width: 70px; text-align: center; }
        .bank-price-label { font-size: 12px; color: #aaa; }

        .mgmt-layout { display: flex; gap: 20px; align-items: flex-start; }
        .sidebar { width: 300px; flex-shrink: 0; background: var(--bg); border-radius: var(--radius); padding: 6px; overflow-y: auto; box-shadow: var(--shadow); }
        #product-editor-area { position: sticky; top: 70px; max-height: calc(100vh - 120px); overflow-y: auto; }
        .sidebar-inner { padding: 10px; }
        .sidebar-item { padding: 10px; cursor: pointer; border-radius: 8px; margin-bottom: 5px; font-size: 14px; border-bottom: 1px solid #f9f9f9; }
        .sidebar-item.active { background: var(--teal-light); color: var(--teal); font-weight: 700; border-right: 4px solid var(--teal); }
        .sidebar-cat-banner {
            position: relative; height: 70px; overflow: hidden; margin-bottom: 0;
        }
        .sidebar-cat-banner img {
            position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
        }
        .sidebar-cat-banner-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to left, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.2) 100%);
            display: flex; align-items: center; padding: 0 12px;
            gap: 8px;
        }
        .sidebar-cat-title {
            color: white; font-weight: 900; font-size: 15px; text-shadow: 0 1px 4px rgba(0,0,0,0.7);
            flex: 1;
        }
        .sidebar-cat-rename-btn {
            background: none; border: none; cursor: pointer; font-size: 13px;
            color: rgba(255,255,255,0.8); padding: 2px 5px; border-radius: 4px; transition: 0.15s;
        }
        .sidebar-cat-rename-btn:hover { background: rgba(255,255,255,0.2); }

        .summary-footer {
            position: fixed; bottom: 0; width: 100%; z-index: 1001;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-top: 1px solid rgba(0,130,145,0.15);
            box-shadow: 0 -4px 30px rgba(0,0,0,0.1);
            padding: 14px 24px;
            display: flex; justify-content: space-between; align-items: center; gap: 12px;
        }
        .footer-stats {
            display: flex; flex-direction: column; gap: 2px;
        }
        .footer-stats .stat-label { font-size: 11px; color: #999; font-weight: 500; }
        .footer-stats .stat-value { font-size: 17px; font-weight: 900; color: var(--teal); }
        .footer-actions { display: flex; gap: 8px; align-items: center; }
        .btn-export-main {
            display: flex; align-items: center; gap: 7px;
            background: transparent; color: var(--teal);
            border: 2px solid var(--teal); padding: 9px 18px; border-radius: 50px;
            font-weight: 700; cursor: pointer; font-family: 'Heebo'; font-size: 13px;
            transition: all 0.2s; white-space: nowrap;
        }
        .btn-export-main:hover { background: var(--teal); color: white; transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0,130,145,0.25); }
        .btn-export-main:active { transform: translateY(0); }
        .btn-export-main .btn-icon { font-size: 16px; }

        /* תפריט שמור נפתח */
        .save-dropdown-wrap { position: relative; }
        .save-dropdown {
            display: none; position: absolute; bottom: calc(100% + 8px); right: 0;
            background: white; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            overflow: hidden; min-width: 160px; z-index: 9999;
        }
        .save-dropdown.open { display: block; }
        .save-dropdown button {
            display: block; width: 100%; padding: 12px 16px; border: none; background: none;
            text-align: right; font-family: 'Heebo'; font-size: 14px; font-weight: 700;
            cursor: pointer; color: #333; transition: 0.15s;
        }
        .save-dropdown button:hover { background: #f0f8f9; color: var(--teal); }
        .save-dropdown button:not(:last-child) { border-bottom: 1px solid #f0f0f0; }

        /* טאבים בהזמנות שמורות */
        .saved-tab-btn {
            padding: 8px 18px; border: none; border-radius: 50px; cursor: pointer;
            font-family: 'Heebo'; font-size: 13px; font-weight: 700;
            background: #f0f0f0; color: #666; transition: 0.2s;
        }
        .saved-tab-btn.active { background: var(--teal); color: white; }

        /* פילטר הכנסות */
        .rev-filter-btn {
            padding: 5px 13px; border: 1.5px solid #ddd; border-radius: 20px;
            cursor: pointer; font-family: 'Heebo'; font-size: 12px; font-weight: 700;
            background: white; color: #666; transition: 0.2s;
        }
        .rev-filter-btn.active { background: var(--teal); color: white; border-color: var(--teal); }

        /* כרטיסי נתון */
        .stat-box {
            flex: 1; min-width: 120px; background: #f8f9fa; border-radius: 12px;
            padding: 14px 16px; text-align: center;
        }
        .stat-box .sb-val { font-size: 22px; font-weight: 900; color: var(--teal); }
        .stat-box .sb-lbl { font-size: 11px; color: #999; margin-top: 2px; }
        .stat-box.sb-gold { background: #fffde7; }
        .stat-box.sb-gold .sb-val { color: var(--gold); }

        /* כפתורי פעולה בהזמנות שמורות — שקוף עם מסגרת */
        .btn-order-action {
            display: inline-flex; align-items: center; gap: 5px;
            background: transparent; border: 1.5px solid currentColor;
            padding: 6px 12px; border-radius: 20px;
            font-family: 'Heebo'; font-size: 12px; font-weight: 700;
            cursor: pointer; transition: all 0.2s; white-space: nowrap;
        }
        .btn-order-action:hover { opacity: 0.75; transform: translateY(-1px); }
        .btn-order-action.c-teal   { color: var(--teal); }
        .btn-order-action.c-purple { color: #7b5ea7; }
        .btn-order-action.c-dark   { color: #37474f; }
        .btn-order-action.c-green  { color: #2e7d32; }
        .btn-order-action.c-red    { color: #e53935; }

        /* באנר קטגוריה */
        .cat-banner {
            height: 110px; background-size: cover; background-position: center;
            border-radius: 10px 10px 0 0;
            margin: -25px -25px 20px -25px;
            position: relative; overflow: hidden;
        }
        .cat-banner-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.6) 100%);
            display: flex; align-items: flex-end; padding: 14px 20px;
        }
        .cat-banner-title {
            color: white; font-size: 19px; font-weight: 900; margin: 0;
            text-shadow: 0 2px 10px rgba(0,0,0,0.6);
        }
        @media (max-width: 768px) {
            .cat-banner { margin: -15px -15px 16px -15px; height: 85px; }
            .cat-banner-title { font-size: 16px; }
        }

        .delete-btn { color: #ff4d4d; border: none; background: none; cursor: pointer; font-weight: bold; font-size: 18px; }
        .add-btn-small { background: var(--teal-light); color: var(--teal); border: none; padding: 8px 15px; border-radius: 50px; cursor: pointer; font-weight: 700; margin-bottom: 10px; font-family: 'Heebo'; }

        #pdf-hidden-wrap { position: fixed; left: -9999px; top: 0; background: white; width: 210mm; direction: rtl; }

        /* ===== מובייל טאבלט ===== */
        @media (max-width: 768px) {
            .header { padding: 10px 16px; }
            .header-logo { display: none; }
            .header-text { display: block; }

            /* תפריט: שורה אחת עם גלילה אופקית */
            .nav-main {
                flex-wrap: nowrap;
                overflow-x: auto;
                justify-content: flex-start;
                gap: 6px;
                padding: 10px 12px;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
            }
            .nav-main::-webkit-scrollbar { display: none; }
            .nav-btn { padding: 9px 14px; font-size: 13px; white-space: nowrap; flex-shrink: 0; }

            .container { padding: 0 12px 130px 12px; margin: 10px auto; }
            .card { padding: 15px; }

            .order-info-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
            .order-info-grid input { padding: 9px; font-size: 13px; }

            .bank-input-unit { width: 45px; }
            .bank-input-price { width: 55px; }

            .mgmt-layout { flex-direction: column; }
            .sidebar { width: 100% !important; max-width: 100% !important; }
            .sidebar-cat-banner { height: 60px; }

            /* פוטר */
            .summary-footer { padding: 10px 12px; gap: 8px; }
            .footer-actions { gap: 6px; }
            .btn-export-main { padding: 10px 14px; font-size: 13px; border-radius: 12px; gap: 5px; }
            .btn-export-main .btn-icon { font-size: 15px; }
            .footer-stats .stat-value { font-size: 15px; }
        }

        /* ===== מובייל קטן ===== */
        @media (max-width: 480px) {
            .order-info-grid { grid-template-columns: 1fr 1fr; }
            .summary-footer { padding: 8px 10px; }
            .btn-export-main { padding: 7px 12px; font-size: 12px; border-width: 1.5px; }
            .btn-export-main .btn-icon { font-size: 14px; }
            .footer-stats .stat-label { font-size: 10px; }
            .footer-stats .stat-value { font-size: 14px; }
            .card { padding: 12px; }
        }
    </style>
</head>
<body>

<!-- מסך כניסה -->
<div id="login-overlay">
    <div class="login-box">
        <img src="libis-logo.png" alt="ליביס" onerror="this.style.display='none'">
        <h2>ליביס – מערכת ניהול</h2>
        <p>אנא הכנס פרטי כניסה</p>
        <div class="login-field">
            <label>שם משתמש</label>
            <input type="text" id="login-user" placeholder="שם משתמש" autocomplete="username" onkeydown="if(event.key==='Enter') document.getElementById('login-pass').focus()">
        </div>
        <div class="login-field">
            <label>סיסמא</label>
            <input type="password" id="login-pass" placeholder="סיסמא" autocomplete="current-password" onkeydown="if(event.key==='Enter') doLogin()">
        </div>
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:#666;cursor:pointer;margin-bottom:4px;justify-content:center;">
            <input type="checkbox" id="remember-me" style="width:16px;height:16px;cursor:pointer;accent-color:var(--teal);">
            זכור אותי במכשיר זה
        </label>
        <button class="login-btn" onclick="doLogin()">כניסה →</button>
        <div class="login-error" id="login-error"></div>
    </div>
</div>

<!-- תוכן האפליקציה -->
<div id="app-content">

<div class="header">
    <img src="libis-logo.png" alt="Libis Logo" class="header-logo">
    <div class="header-text">ליביס</div>
</div>

<div class="nav-main">
    <button class="nav-btn active" onclick="switchMainTab('order-tab', this)">🛒 יצירת הזמנה</button>
    <button class="nav-btn" onclick="switchMainTab('saved-tab', this)">📋 הזמנות שמורות</button>
    <button class="nav-btn" onclick="switchMainTab('bank-tab', this)">🏦 בנק חומרי גלם</button>
    <button class="nav-btn" onclick="switchMainTab('recipes-tab', this)">📖 מתכוני מוצרים</button>
</div>

<div id="order-tab" class="container active">
    <div class="card order-info-grid">
        <input type="text" id="cust-name" placeholder="שם הלקוח">
        <input type="text" id="cust-date" placeholder="תאריך">
        <input type="text" id="cust-loc" placeholder="מיקום">
        <input type="text" id="cust-phone" placeholder="טלפון">
    </div>
    <div id="order-products-container"></div>
    <div class="card" style="margin-top:10px;">
        <label style="display:block; font-weight:700; color:var(--teal); margin-bottom:10px; font-size:15px;">📝 הערות כלליות להזמנה</label>
        <textarea id="order-notes" rows="4" placeholder="הערות, בקשות מיוחדות, פרטים נוספים..."
            style="width:100%; padding:12px; border:1px solid #ddd; border-radius:10px; font-family:'Heebo'; font-size:14px; resize:vertical; box-sizing:border-box; line-height:1.6;"></textarea>
    </div>
</div>

<div id="bank-tab" class="container">
    <div style="display:flex; gap:10px; margin-bottom:16px; align-items:center;">
        <button class="add-btn-small" style="margin:0;" onclick="addBankCategory()">+ קטגוריה חדשה בבנק</button>
    </div>
    <div id="bank-list-container"></div>
</div>

<div id="recipes-tab" class="container">
    <div style="margin-bottom:16px;">
        <button class="add-btn-small" onclick="addMenuCategory()">+ קטגוריה חדשה בתפריט</button>
    </div>
    <div class="mgmt-layout" id="mgmt-layout">
        <div class="sidebar" id="sidebar-menu-list" style="width:100%; max-width:100%;"></div>
        <div id="product-editor-area" style="display:none; flex:1; background:white; border-radius:var(--radius); padding:25px; box-shadow:var(--shadow);"></div>
    </div>
</div>

<div class="summary-footer">
    <div class="footer-stats">
        <div style="display:flex;gap:18px;align-items:flex-end;">
            <div>
                <span class="stat-label">סה"כ הזמנה</span><br>
                <span class="stat-value" id="stat-total-rev">0 ₪</span>
            </div>
            <div>
                <span class="stat-label">רווח משוער</span><br>
                <span class="stat-value" id="stat-total-profit" style="color:var(--gold);">0 ₪</span>
            </div>
        </div>
    </div>
    <div class="footer-actions">
        <div class="save-dropdown-wrap">
            <button class="btn-export-main" onclick="toggleSaveMenu(event)">
                <span class="btn-icon">💾</span><span class="btn-text"> שמור ▾</span>
            </button>
            <div class="save-dropdown" id="save-dropdown">
                <button onclick="saveCurrentOrder('future');closeSaveMenu()">📅 הזמנה עתידית</button>
                <button onclick="saveCurrentOrder('draft');closeSaveMenu()">📝 טיוטה</button>
            </div>
        </div>
        <button class="btn-export-main" onclick="generatePDF('invoice')">
            <span class="btn-icon">📄</span><span class="btn-text"> הפק הזמנה</span>
        </button>
        <button class="btn-export-main" onclick="generatePDF('shopping')">
            <span class="btn-icon">🛒</span><span class="btn-text"> רשימת קניות</span>
        </button>
    </div>
</div>

<div id="saved-tab" class="container">

    <!-- לוח הכנסות מתכווץ -->
    <div class="card" style="margin-bottom:14px;padding:12px 18px;">
        <div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;" onclick="toggleRevenue()">
            <span style="font-weight:700;font-size:14px;color:var(--teal);">📊 סיכום הכנסות</span>
            <div style="display:flex;align-items:center;gap:10px;">
                <span id="revenue-quick" style="font-size:13px;color:#666;"></span>
                <span id="revenue-arrow" style="font-size:16px;color:#aaa;transition:0.2s;">▼</span>
            </div>
        </div>
        <div id="revenue-body" style="display:none;margin-top:14px;">
            <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;">
                <button class="rev-filter-btn active" onclick="switchRevFilter('all',this)">כללי</button>
                <button class="rev-filter-btn" onclick="switchRevFilter('year',this)">שנתי</button>
                <button class="rev-filter-btn" onclick="switchRevFilter('month',this)">חודשי</button>
                <button class="rev-filter-btn" onclick="switchRevFilter('week',this)">שבועי</button>
            </div>
            <div id="revenue-stats" style="display:flex;gap:12px;flex-wrap:wrap;"></div>
        </div>
    </div>

    <!-- תת-טאבים -->
    <div style="display:flex;gap:8px;margin-bottom:16px;border-bottom:2px solid #eee;padding-bottom:10px;flex-wrap:wrap;">
        <button class="saved-tab-btn active" onclick="switchSavedTab('future',this)">📅 עתידיות</button>
        <button class="saved-tab-btn" onclick="switchSavedTab('done',this)">✅ בוצע</button>
        <button class="saved-tab-btn" onclick="switchSavedTab('draft',this)">📝 טיוטות</button>
    </div>

    <div id="saved-orders-list"></div>
</div>

<div id="pdf-hidden-wrap"></div>

<script>
    // ===== כניסה =====
    const USERS = {
        'libis': 'libis2025',
        'admin': 'libis123'
    };

    function doLogin() {
        const user  = document.getElementById('login-user').value.trim();
        const pass  = document.getElementById('login-pass').value;
        const remember = document.getElementById('remember-me').checked;
        const errEl = document.getElementById('login-error');
        if (USERS[user] && USERS[user] === pass) {
            if (remember) localStorage.setItem('libis_auth', '1');
            else          sessionStorage.setItem('libis_auth', '1');
            document.getElementById('login-overlay').classList.add('hidden');
            document.getElementById('app-content').style.display = 'block';
            errEl.textContent = '';
        } else {
            errEl.textContent = '❌ שם משתמש או סיסמא שגויים';
            document.getElementById('login-pass').value = '';
            document.getElementById('login-pass').focus();
        }
    }

    // בדיקה אם כבר מחובר
    if (localStorage.getItem('libis_auth') === '1' || sessionStorage.getItem('libis_auth') === '1') {
        document.getElementById('login-overlay').classList.add('hidden');
        document.getElementById('app-content').style.display = 'block';
    }

    function sanitizeState(s) {
        if (!s) return s;
        if (!s.menu) s.menu = [];
        s.menu.forEach(cat => {
            if (!cat.items) cat.items = [];
            cat.items.forEach(item => {
                if (!item.recipe) item.recipe = [];
                if (item.options) {
                    if (!item.optionRecipes) item.optionRecipes = {};
                    item.options.forEach(opt => {
                        if (!item.optionRecipes[opt]) item.optionRecipes[opt] = [];
                    });
                }
            });
        });
        if (!s.bank) s.bank = [];
        s.bank.forEach(cat => { if (!cat.items) cat.items = []; });
        if (!s.savedOrders) s.savedOrders = [];
        s.savedOrders.forEach(o => { if (!o.status) o.status = 'future'; });
        return s;
    }

    function getRecipeArr(item, tab) {
        if (!item.recipe) item.recipe = [];
        if (tab === 'base') return item.recipe;
        if (!item.optionRecipes) item.optionRecipes = {};
        if (!item.optionRecipes[tab]) item.optionRecipes[tab] = [];
        return item.optionRecipes[tab];
    }

    function calcRecipeCost(recipe) {
        if (!recipe) return 0;
        return recipe.reduce((sum, r) => {
            const b = state.bank.flatMap(bc => bc.items).find(bi => bi.id === r.bankId);
            return sum + (b ? b.price * r.qty : 0);
        }, 0);
    }

    function saveCurrentOrder(status = 'future') {
        if (orderItems.length === 0) { alert("אין פריטים בהזמנה לשמירה."); return; }
        const custName  = document.getElementById('cust-name').value  || 'לקוח לא ידוע';
        const custDate  = document.getElementById('cust-date').value  || '';
        const custLoc   = document.getElementById('cust-loc').value   || '';
        const custPhone = document.getElementById('cust-phone').value || '';
        const custNotes = document.getElementById('order-notes').value || '';
        if (!state.savedOrders) state.savedOrders = [];
        let total = 0;
        orderItems.forEach(o => {
            const mi = state.menu.flatMap(c => c.items).find(m => m.id === o.menuId);
            if (mi) total += mi.price * o.qty;
        });
        const ts = Date.now();
        state.savedOrders.unshift({
            id: ts, timestamp: ts,
            createdAt: new Date().toLocaleDateString('he-IL'),
            custName, custDate, custLoc, custPhone, custNotes,
            status, total,
            items: JSON.parse(JSON.stringify(orderItems))
        });
        save();
        const label = status === 'draft' ? 'טיוטה' : 'הזמנה עתידית';
        alert(`✅ נשמר כ${label} עבור "${custName}"`);
    }

    function renderRevenue() {
        const el = document.getElementById('revenue-stats');
        if (!el) return;
        const now = Date.now();
        const quickEl = document.getElementById('revenue-quick');
        const weekMs  = 7  * 24 * 3600 * 1000;
        const monthMs = 30 * 24 * 3600 * 1000;
        const yearMs  = 365* 24 * 3600 * 1000;
        const done = (state.savedOrders || []).filter(o => o.status === 'done');

        function sumIn(ms) {
            return done.filter(o => (o.doneAt || o.id) > now - ms)
                       .reduce((s, o) => s + (o.total || 0), 0);
        }
        const totAll   = done.reduce((s, o) => s + (o.total || 0), 0);
        const totYear  = sumIn(yearMs);
        const totMonth = sumIn(monthMs);
        const totWeek  = sumIn(weekMs);
        const countDone = done.length;

        // תצוגת סיכום קצר בשורה הסגורה
        if (quickEl) quickEl.textContent = `${countDone} הזמנות | ${totAll.toLocaleString()} ₪`;

        const show = (val, lbl, gold=false) =>
            `<div class="stat-box${gold?' sb-gold':''}">
                <div class="sb-val">${val.toLocaleString()} ₪</div>
                <div class="sb-lbl">${lbl}</div>
            </div>`;

        if (_revFilter === 'all')      el.innerHTML = show(totAll,'סה"כ כל הזמנות',true) + show(totYear,'שנה אחרונה') + show(totMonth,'30 יום') + show(totWeek,'7 ימים') + `<div class="stat-box"><div class="sb-val">${countDone}</div><div class="sb-lbl">הזמנות שבוצעו</div></div>`;
        else if (_revFilter==='year')  el.innerHTML = show(totYear,'שנה אחרונה',true) + `<div class="stat-box"><div class="sb-val">${done.filter(o=>(o.doneAt||o.id)>now-yearMs).length}</div><div class="sb-lbl">הזמנות</div></div>`;
        else if (_revFilter==='month') el.innerHTML = show(totMonth,'30 יום אחרונים',true) + `<div class="stat-box"><div class="sb-val">${done.filter(o=>(o.doneAt||o.id)>now-monthMs).length}</div><div class="sb-lbl">הזמנות</div></div>`;
        else if (_revFilter==='week')  el.innerHTML = show(totWeek,'7 ימים אחרונים',true) + `<div class="stat-box"><div class="sb-val">${done.filter(o=>(o.doneAt||o.id)>now-weekMs).length}</div><div class="sb-lbl">הזמנות</div></div>`;
    }

    function duplicateSavedOrder(id) {
        const order = state.savedOrders.find(o => o.id === id);
        if (!order) return;
        const copy = JSON.parse(JSON.stringify(order));
        copy.id = Date.now();
        copy.createdAt = new Date().toLocaleDateString('he-IL');
        copy.custName = copy.custName + ' (עותק)';
        state.savedOrders.unshift(copy);
        save();
        renderSavedOrders();
    }

        const order = state.savedOrders.find(o => o.id === id);
        if (!order) return;
        // שומר זמנית את orderItems הנוכחיים, מייצא ומחזיר
        const prevItems = orderItems;
        const prevName  = document.getElementById('cust-name').value;
        const prevDate  = document.getElementById('cust-date').value;
        const prevLoc   = document.getElementById('cust-loc').value;

        orderItems = JSON.parse(JSON.stringify(order.items));
        document.getElementById('cust-name').value   = order.custName  || '';
        document.getElementById('cust-date').value   = order.custDate  || '';
        document.getElementById('cust-loc').value    = order.custLoc   || '';
        document.getElementById('cust-phone').value  = order.custPhone || '';
        document.getElementById('order-notes').value = order.custNotes || '';

        // מחזיר למצב קודם
        orderItems = prevItems;
        document.getElementById('cust-name').value   = prevName;
        document.getElementById('cust-date').value   = prevDate;
        document.getElementById('cust-loc').value    = prevLoc;
        document.getElementById('cust-phone').value  = prevPhone;

    function removeFromOrder(idx) { orderItems.splice(idx, 1); render(); }
    function updateOrderQty(idx, delta) {
        orderItems[idx].qty = Math.max(1, (orderItems[idx].qty || 1) + delta);
        render();
    }
    function updateOrderOpt(idx, val) { orderItems[idx].option = val; save && save(); }
    function updateOrderNote(idx, val) { orderItems[idx].note = val; }

    function render() {
        const orderCont = document.getElementById('order-products-container');
        orderCont.innerHTML = state.menu.map(cat => `
            <div class="card" style="padding-top:0; overflow:hidden;">
                <div class="cat-banner" id="banner-${cat.cat.replace(/\s/g,'')}">
                    <img src="${getCategoryImage(cat.cat)}"
                         style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;"
                         onerror="this.style.display='none'; this.parentElement.style.background='linear-gradient(135deg,#006b78,#008291)';">
                    <div class="cat-banner-overlay">
                        <h3 class="cat-banner-title">${cat.cat}</h3>
                    </div>
                </div>
                ${cat.items.map(item => {
                    const activeOrders = orderItems.map((o, idx) => ({o, idx})).filter(({o}) => o.menuId === item.id);
                    return `
                    <div style="padding:12px 0; border-bottom:1px solid #f0f0f0;">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <div>
                                <b style="font-size:15px;">${item.name}</b>
                                <span style="color:#888; font-size:13px; margin-right:6px;">${item.price} ₪</span>
                            </div>
                            ${activeOrders.length === 0
                                ? `<button class="add-btn-small" style="margin:0;" onclick="addToOrder(${item.id})">+ הוסף להזמנה</button>`
                                : `<button class="add-btn-small" style="margin:0; background:var(--gold-light); color:var(--gold);" onclick="addToOrder(${item.id})">+ הוסף סוג נוסף</button>`
                            }
                        </div>
                        ${activeOrders.map(({o, idx}, entryNum) => `
                            <div style="background:#f0f8f9; border:1px solid #c5e8ec; border-radius:10px; padding:12px 14px; margin-top:8px;">
                                <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
                                    ${activeOrders.length > 1 ? `<span style="font-size:11px;background:var(--teal);color:white;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-weight:900;">${entryNum+1}</span>` : ''}
                                    <div style="display:flex; align-items:center; gap:6px; background:white; border-radius:50px; padding:4px 8px; border:1px solid #ddd;">
                                        <button onclick="updateOrderQty(${idx},-1)"
                                            style="width:28px;height:28px;border-radius:50%;border:none;background:var(--teal);color:white;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;">−</button>
                                        <span style="min-width:30px;text-align:center;font-weight:900;font-size:16px;">${o.qty}</span>
                                        <button onclick="updateOrderQty(${idx},1)"
                                            style="width:28px;height:28px;border-radius:50%;border:none;background:var(--teal);color:white;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;">+</button>
                                    </div>
                                    <span style="font-weight:700; color:var(--teal);">${item.price * o.qty} ₪</span>
                                    <button class="delete-btn" style="margin-right:auto;" onclick="removeFromOrder(${idx})">✖ הסר</button>
                                </div>
                                ${item.options ? `
                                <div style="margin-top:10px;">
                                    <div style="font-size:12px; color:#666; margin-bottom:6px; font-weight:700;">בחר סוג${activeOrders.length > 1 ? ' לשורה ' + (entryNum+1) : ''}:</div>
                                    <div style="display:flex; gap:8px; flex-wrap:wrap;">
                                        ${item.options.map(opt => `
                                            <label style="display:flex;align-items:center;gap:6px;background:${o.option===opt?'var(--teal)':'white'};color:${o.option===opt?'white':'#333'};border:2px solid ${o.option===opt?'var(--teal)':'#ddd'};border-radius:50px;padding:6px 14px;cursor:pointer;font-size:13px;font-weight:${o.option===opt?'700':'400'};transition:0.2s;">
                                                <input type="radio" name="opt-${idx}" value="${opt}" ${o.option===opt?'checked':''} onchange="updateOrderOpt(${idx},'${opt}'); render();" style="display:none;">
                                                ${opt}
                                            </label>
                                        `).join('')}
                                    </div>
                                </div>` : ''}
                                <div style="margin-top:10px;">
                                    <input type="text" placeholder="הערה (אופציונלי)..."
                                        value="${o.note || ''}"
                                        onchange="updateOrderNote(${idx}, this.value)"
                                        style="width:100%; padding:8px 12px; border:1px solid #ddd; border-radius:8px; font-family:'Heebo'; font-size:13px; box-sizing:border-box; background:white;">
                                </div>
                            </div>
                        `).join('')}
                    </div>`;
                }).join('')}
            </div>
        `).join('');

        const bankCont = document.getElementById('bank-list-container');
        bankCont.innerHTML = state.bank.map((cat, cIdx) => `
            <div class="card" style="padding:16px 20px;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                    <div style="display:flex; align-items:center; gap:8px;">
                        <span style="color:var(--teal); font-size:16px;">📂</span>
                        <span style="font-weight:900; color:var(--teal); font-size:15px;">${cat.cat}</span>
                        <span style="font-size:12px; color:#bbb;">(${cat.items.length} פריטים)</span>
                    </div>
                    <button class="add-btn-small" style="margin:0; padding:5px 12px; font-size:12px;" onclick="addBankItem(${cIdx})">+ הוסף</button>
                </div>
                <div style="display:flex; padding:4px 7px; font-size:11px; color:#aaa; font-weight:700; border-bottom:2px solid #eee; margin-bottom:2px;">
                    <span style="flex:1;">שם חומר הגלם</span>
                    <span style="width:55px; text-align:center;">יחידה</span>
                    <span style="width:70px; text-align:center;">מחיר ₪</span>
                    <span style="width:28px;"></span>
                </div>
                <div class="bank-grid">
                    ${cat.items.map((m, mIdx) => `
                        <div class="bank-item-row">
                            <input class="bank-input bank-input-name" value="${m.name}" onchange="updateBank(${cIdx},${mIdx},'name',this.value)">
                            <input class="bank-input bank-input-unit" value="${m.unit || 'יח'}" onchange="updateBank(${cIdx},${mIdx},'unit',this.value)">
                            <input class="bank-input bank-input-price" type="number" value="${m.price}" onchange="updateBank(${cIdx},${mIdx},'price',this.value)">
                            <button class="delete-btn" style="font-size:14px; padding:0 4px;" onclick="deleteBank(${cIdx},${mIdx})">✖</button>
                        </div>
                    `).join('')}
                </div>
            </div>
        `).join('');

        const sidebar = document.getElementById('sidebar-menu-list');
        sidebar.innerHTML = state.menu.map((cat, cIdx) => `
            <div style="margin-bottom:4px; border-radius:10px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.07);">
                <!-- באנר תמונה לקטגוריה -->
                <div class="sidebar-cat-banner">
                    <img src="${getCategoryImage(cat.cat)}"
                        onerror="this.style.display='none'; this.parentElement.style.background='linear-gradient(135deg,#006b78,#008291)';">
                    <div class="sidebar-cat-banner-overlay">
                        <span class="sidebar-cat-title">${cat.cat}</span>
                        <button class="sidebar-cat-rename-btn"
                            onclick="event.stopPropagation(); promptRenameCategory(${cIdx});"
                            title="שנה שם">✏️</button>
                    </div>
                </div>
                <!-- רשימת מוצרים -->
                <div style="background:white; padding:6px 8px 4px;">
                    <div id="drop-zone-${cIdx}"
                        ondragover="event.preventDefault(); document.getElementById('drop-zone-${cIdx}').style.background='#e0f2f4';"
                        ondragleave="document.getElementById('drop-zone-${cIdx}').style.background='transparent';"
                        ondrop="dropItem(event,${cIdx}); document.getElementById('drop-zone-${cIdx}').style.background='transparent';"
                        style="border-radius:8px; min-height:8px; transition:0.2s;">
                        ${cat.items.map((item, iIdx) => `
                            <div class="sidebar-item" id="side-${item.id}"
                                draggable="true"
                                ondragstart="dragItem(event,${cIdx},${iIdx})"
                                onclick="openEditor(${cIdx},${iIdx})"
                                style="display:flex; align-items:center; gap:6px; padding:6px 8px; cursor:pointer;">
                                <span style="color:#ccc; cursor:grab; font-size:15px;" title="גרור">⠿</span>
                                <span style="flex:1; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${item.name}</span>
                                <button onclick="event.stopPropagation(); promptRenameMenuItem(${cIdx},${iIdx});"
                                    title="ערוך שם" style="border:none;background:none;cursor:pointer;color:#aaa;font-size:14px;padding:2px;line-height:1;">✏️</button>
                                <button onclick="event.stopPropagation(); deleteMenuItem(${cIdx},${iIdx});"
                                    title="מחק מוצר" style="border:none;background:none;cursor:pointer;color:#ff6b6b;font-size:14px;padding:2px;line-height:1;">🗑️</button>
                            </div>
                        `).join('')}
                    </div>
                    <button class="add-btn-small" style="width:100%; font-size:11px; margin-top:4px;" onclick="addMenuItem(${cIdx})">+ מוצר חדש</button>
                </div>
            </div>
        `).join('');

        updateStats();
        renderSavedOrders();
    }

    function updateBank(cIdx, mIdx, f, v) { state.bank[cIdx].items[mIdx][f] = f==='price'?parseFloat(v):v; save(); updateStats(); }
    function deleteBank(cIdx, mIdx) { state.bank[cIdx].items.splice(mIdx, 1); render(); save(); }
    function addBankItem(cIdx) { state.bank[cIdx].items.push({id:Date.now(), name:"חדש", unit:"יח", price:0}); render(); save(); }
    function addBankCategory() { const n = prompt("שם קטגוריה:"); if(n) { state.bank.push({cat:n, items:[]}); render(); save(); } }
    function addMenuCategory() { const n = prompt("שם קטגוריה:"); if(n) { state.menu.push({cat:n, items:[]}); render(); save(); } }
    function renameCategory(cIdx, val) { if(val.trim()) { state.menu[cIdx].cat = val.trim(); save(); } }
    function promptRenameCategory(cIdx) {
        const n = prompt("שם חדש לקטגוריה:", state.menu[cIdx].cat);
        if (n && n.trim()) { state.menu[cIdx].cat = n.trim(); save(); render(); }
    }
    function renameMenuItem(cIdx, iIdx, val) { if(val.trim()) { state.menu[cIdx].items[iIdx].name = val.trim(); save(); } }

    function promptRenameMenuItem(cIdx, iIdx) {
        const item = state.menu[cIdx].items[iIdx];
        const n = prompt("שם חדש למוצר:", item.name);
        if (n && n.trim()) { item.name = n.trim(); save(); render(); }
    }

    function deleteMenuItem(cIdx, iIdx) {
        const item = state.menu[cIdx].items[iIdx];
        if (confirm(`למחוק את "${item.name}"?`)) {
            state.menu[cIdx].items.splice(iIdx, 1);
            save(); render(); closeEditor();
        }
    }

    function updateItemPrice(cIdx, iIdx, val) {
        const p = parseFloat(val);
        if (p > 0) { state.menu[cIdx].items[iIdx].price = p; save(); openEditor(cIdx, iIdx); }
    }

    let _dragSrc = null;
    function dragItem(event, cIdx, iIdx) {
        _dragSrc = { cIdx, iIdx };
        event.dataTransfer.effectAllowed = 'move';
    }
    function dropItem(event, toCIdx) {
        event.preventDefault();
        if (!_dragSrc) return;
        const { cIdx: fromC, iIdx: fromI } = _dragSrc;
        const item = state.menu[fromC].items.splice(fromI, 1)[0];
        state.menu[toCIdx].items.push(item);
        _dragSrc = null;
        save(); render();
    }
    function addMenuItem(cIdx) { const n = prompt("שם מוצר:"); if(n) { state.menu[cIdx].items.push({id:Date.now(), name:n, price:100, recipe:[]}); render(); save(); } }

    const FRACS = [
        { label: 'שלם',  sym: '1',  val: 1       },
        { label: 'חצי',  sym: '½',  val: 0.5     },
        { label: 'שליש', sym: '⅓',  val: 1/3     },
        { label: 'רבע',  sym: '¼',  val: 0.25    },
        { label: 'שני שליש', sym: '⅔', val: 2/3  },
        { label: 'שלושה רבע', sym: '¾', val: 0.75 }
    ];

    function qtyLabel(q, unit) {
        const frac = FRACS.find(f => Math.abs(f.val - q) < 0.01);
        return frac ? `${frac.sym} ${unit}` : `${q} ${unit}`;
    }

    function fracDisplay(q) {
        const whole = Math.floor(q);
        const remainder = Math.round((q - whole) * 1000) / 1000;
        const frac = FRACS.find(f => f.val < 1 && Math.abs(f.val - remainder) < 0.02);
        if (remainder === 0) return `${whole}`;
        if (frac && whole === 0) return frac.sym;
        if (frac && whole > 0) return `${whole}${frac.sym}`;
        return q.toFixed(2);
    }

    function toggleFracMenu(id) {
        document.querySelectorAll('.frac-menu').forEach(el => { if (el.id !== id) el.style.display = 'none'; });
        const m = document.getElementById(id);
        m.style.display = m.style.display === 'none' ? 'flex' : 'none';
    }

    document.addEventListener('click', e => {
        if (!e.target.closest('.frac-menu') && !e.target.classList.contains('frac-toggle')) {
            document.querySelectorAll('.frac-menu').forEach(el => el.style.display = 'none');
        }
    });

    function renderRecipeRows(recipe, cIdx, iIdx, tab) {
        if (recipe.length === 0) return '<p style="color:#aaa;">אין מרכיבים עדיין. הוסף מהרשימה למטה.</p>';
        const cost = calcRecipeCost(recipe);
        return recipe.map((r, rIdx) => {
            const b = state.bank.flatMap(bc => bc.items).find(bi => bi.id === r.bankId);
            const rowCost = b ? (b.price * r.qty) : 0;
            const unit = b ? b.unit : '';
            const step = (unit === 'קילו' || unit === 'ליטר') ? 0.1 : 1;
            const tabEsc = tab.replace(/'/g, "\\'");
            const menuId = `frac-${cIdx}-${iIdx}-${rIdx}`;
            return `
                <div style="position:relative; display:flex; align-items:center; background:#fefefe; border:1px solid #eee; padding:10px 14px; border-radius:8px; margin-bottom:8px; gap:10px;">
                    <span style="flex:2; font-weight:500;">${b ? b.name : 'חומר נמחק'}</span>
                    <div style="display:flex; align-items:center; gap:4px; background:#f0f0f0; border-radius:50px; padding:4px 8px;">
                        <button onclick="updateRecipeQty(${cIdx},${iIdx},${rIdx},${Math.max(0,Math.round((r.qty-step)*1000)/1000)},'${tabEsc}')"
                            style="width:28px;height:28px;border-radius:50%;border:none;background:var(--teal);color:white;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;">−</button>
                        <span style="min-width:55px;text-align:center;font-weight:700;font-size:13px;">${qtyLabel(r.qty, unit)}</span>
                        <button class="frac-toggle" onclick="event.stopPropagation(); toggleFracMenu('${menuId}')"
                            style="width:28px;height:28px;border-radius:50%;border:none;background:var(--teal);color:white;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;">+</button>
                    </div>

                    <div id="${menuId}" class="frac-menu" style="display:none; position:absolute; left:50%; transform:translateX(-50%); top:48px; background:white; border-radius:12px; box-shadow:0 6px 24px rgba(0,0,0,0.15); padding:10px; z-index:200; flex-wrap:wrap; gap:6px; width:220px; justify-content:center;">
                        <div style="width:100%; text-align:center; font-size:11px; color:#999; margin-bottom:4px; font-weight:700;">הוסף כמות:</div>
                        ${FRACS.map(f => `
                            <button onclick="event.stopPropagation(); updateRecipeQty(${cIdx},${iIdx},${rIdx},${Math.round((r.qty+f.val)*1000)/1000},'${tabEsc}');"
                                style="padding:6px 12px; border:1px solid #ddd; border-radius:20px; cursor:pointer; background:white; font-family:'Heebo'; font-size:13px; font-weight:700; display:flex; flex-direction:column; align-items:center; gap:1px; min-width:55px;">
                                <span style="font-size:16px;">${f.sym}</span>
                                <span style="font-size:10px; color:#888;">${f.label}</span>
                            </button>
                        `).join('')}
                    </div>

                    <span style="min-width:70px;text-align:center;font-weight:700;color:var(--teal);">${rowCost.toFixed(2)} ₪</span>
                    <button class="delete-btn" onclick="removeRecipeRow(${cIdx},${iIdx},${rIdx},'${tabEsc}')">✖</button>
                </div>`;
        }).join('') + `
            <div style="display:flex;justify-content:space-between;align-items:center;background:var(--teal-light);border:2px solid var(--teal);padding:12px 15px;border-radius:8px;margin-top:10px;font-weight:900;">
                <span>סה"כ עלות:</span>
                <span style="color:var(--teal);font-size:1.15em;">${cost.toFixed(2)} ₪</span>
            </div>`;
    }

    function closeEditor() {
        document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
        const area = document.getElementById('product-editor-area');
        area.style.display = 'none';
        const layout = document.getElementById('mgmt-layout');
        layout.style.alignItems = 'flex-start';
        const sidebar = document.getElementById('sidebar-menu-list');
        sidebar.style.width = '100%';
        sidebar.style.maxWidth = '100%';
        sidebar.style.flex = '';
    }

    function openEditor(cIdx, iIdx) {
        document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
        const item = state.menu[cIdx].items[iIdx];
        document.getElementById(`side-${item.id}`).classList.add('active');
        const area = document.getElementById('product-editor-area');
        area.style.display = 'block';
        const sidebar = document.getElementById('sidebar-menu-list');
        sidebar.style.width = '320px';
        sidebar.style.maxWidth = '320px';
        sidebar.style.flex = '0 0 320px';

        if (!item.options) _editorTab = 'base';
        else if (_editorTab !== 'base' && !item.options.includes(_editorTab)) _editorTab = 'base';

        const draw = () => {
            const baseCost = calcRecipeCost(item.recipe);
            const hasOptions = !!(item.options && item.options.length);

            // עלות כוללת = בסיס + אופציה נבחרת (לתצוגת רווח)
            const displayOptCost = (hasOptions && _editorTab !== 'base')
                ? calcRecipeCost(getRecipeArr(item, _editorTab)) : 0;
            const displayCost = baseCost + displayOptCost;

            const tabsHtml = hasOptions ? `
                <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;padding-bottom:14px;border-bottom:2px solid #eee;">
                    <button onclick="_setTab('base')" style="padding:7px 14px;border-radius:50px;border:none;cursor:pointer;font-family:'Heebo';font-weight:700;font-size:13px;background:${_editorTab==='base'?'var(--teal)':'#f0f0f0'};color:${_editorTab==='base'?'white':'#333'};">
                        🍽️ בסיס משותף
                    </button>
                    ${item.options.map(opt => {
                        const oc = calcRecipeCost(getRecipeArr(item, opt));
                        return `<button onclick="_setTab('${opt.replace(/'/g,"\\'")}\')" style="padding:7px 14px;border-radius:50px;border:none;cursor:pointer;font-family:'Heebo';font-weight:700;font-size:13px;background:${_editorTab===opt?'var(--gold)':'#f0f0f0'};color:${_editorTab===opt?'white':'#333'};">
                            ${opt}${oc>0?` <small>(${oc.toFixed(0)}₪)</small>`:''}
                        </button>`;
                    }).join('')}
                </div>` : '';

            const currentRecipe = getRecipeArr(item, _editorTab);
            const tabEsc = _editorTab.replace(/'/g, "\\'");

            const noteHtml = hasOptions && _editorTab !== 'base'
                ? `<p style="color:#888;font-size:12px;margin-bottom:10px;">💡 חומרים כאן מתווספים <b>על גבי הבסיס המשותף</b> עבור מילוי זה.</p>` : '';

            area.innerHTML = `
                <button onclick="closeEditor()" style="background:none;border:none;color:#aaa;cursor:pointer;font-size:13px;padding:0;margin-bottom:14px;display:flex;align-items:center;gap:4px;font-family:'Heebo';">← חזרה לרשימה</button>
                <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;">
                    <h2 style="margin:0;">${item.name}</h2>
                    <div style="text-align:left;background:#f8f8f8;padding:10px 16px;border-radius:10px;font-size:13px;">
                        <div style="display:flex;align-items:center;gap:6px;">
                            <span>מחיר מכירה:</span>
                            <input type="number" value="${item.price}" min="0"
                                onchange="updateItemPrice(${cIdx},${iIdx},this.value)"
                                style="width:75px;border:1px solid #ddd;border-radius:6px;padding:3px 8px;font-family:'Heebo';font-weight:700;font-size:14px;color:var(--teal);">
                            <span>₪</span>
                        </div>
                        <div>עלות ייצור: <b style="color:var(--teal);">${displayCost.toFixed(2)} ₪</b></div>
                        <div>רווח: <b style="color:green;">${(item.price - displayCost).toFixed(2)} ₪</b></div>
                    </div>
                </div>
                ${tabsHtml}
                ${noteHtml}
                <div id="recipe-list">${renderRecipeRows(currentRecipe, cIdx, iIdx, _editorTab)}</div>
                <div style="margin-top:20px;padding:16px;background:#f0f7f8;border-radius:12px;display:flex;gap:10px;align-items:center;">
                    <select id="bank-select-tool" style="flex:1;padding:10px;border-radius:8px;border:1px solid #ccc;font-family:'Heebo';">
                        <option value="">-- בחר חומר מהבנק --</option>
                        ${state.bank.map(cat => `
                            <optgroup label="${cat.cat}">
                                ${cat.items.map(bi => `<option value="${bi.id}">${bi.name} (${bi.unit||'יח'})</option>`).join('')}
                            </optgroup>`).join('')}
                    </select>
                    <button class="add-btn-small" style="margin:0;padding:12px 20px;" onclick="addMaterialToRecipe(${cIdx},${iIdx},'${tabEsc}')">הוסף</button>
                </div>`;
        };

        window._setTab = (tab) => { _editorTab = tab; draw(); };
        draw();
    }

    window.addMaterialToRecipe = function(cIdx, iIdx, tab) {
        const select = document.getElementById('bank-select-tool');
        const rawVal = select.value;
        const bid = isNaN(rawVal) ? rawVal : parseInt(rawVal);
        if (!bid) return;
        const item = state.menu[cIdx].items[iIdx];
        getRecipeArr(item, tab).push({ bankId: bid, qty: 1 });
        save();
        _editorTab = tab;
        openEditor(cIdx, iIdx);
    };

    window.updateRecipeQty = function(cIdx, iIdx, rIdx, val, tab) {
        const rounded = Math.round(parseFloat(val) * 100) / 100;
        const item = state.menu[cIdx].items[iIdx];
        getRecipeArr(item, tab)[rIdx].qty = Math.max(0, rounded) || 0;
        save();
        _editorTab = tab;
        openEditor(cIdx, iIdx);
    };

    window.removeRecipeRow = function(cIdx, iIdx, rIdx, tab) {
        const item = state.menu[cIdx].items[iIdx];
        getRecipeArr(item, tab).splice(rIdx, 1);
        save();
        _editorTab = tab;
        openEditor(cIdx, iIdx);
    };


    function getOrderItemRecipes(mi, o) {
        const recipes = [...mi.recipe];
        if (o.option && mi.optionRecipes && mi.optionRecipes[o.option]) {
            recipes.push(...mi.optionRecipes[o.option]);
        }
        return recipes;
    }

    function calcOrderProfit(orderItems) {
        let rev = 0, cost = 0;
        orderItems.forEach(o => {
            const mi = state.menu.flatMap(c => c.items).find(m => m.id === o.menuId);
            if (!mi) return;
            rev += mi.price * o.qty;
            getOrderItemRecipes(mi, o).forEach(r => {
                const bi = state.bank.flatMap(bc => bc.items).find(b => b.id === r.bankId);
                if (bi) cost += (bi.price * r.qty) * o.qty;
            });
        });
        return { rev, cost, profit: rev - cost };
    }

    function updateStats() {
        let rev = 0, cost = 0;
        orderItems.forEach(o => {
            const mi = state.menu.flatMap(c => c.items).find(m => m.id === o.menuId);
            if (!mi) return;
            rev += mi.price * o.qty;
            getOrderItemRecipes(mi, o).forEach(r => {
                const bi = state.bank.flatMap(bc => bc.items).find(b => b.id === r.bankId);
                if (bi) cost += (bi.price * r.qty) * o.qty;
            });
        });
        document.getElementById('stat-total-rev').innerText = rev.toLocaleString() + ' ₪';
        document.getElementById('stat-total-profit').innerText = (rev - cost).toLocaleString() + ' ₪';
    }

    function openPrintWindow(html) {
        const win = window.open('', '_blank');

        win.onload = () => { win.focus(); win.print(); };

            const today = new Date().toLocaleDateString('he-IL');

            openPrintWindow(`<!DOCTYPE html>

        } else {

    window.onload = async () => {

        try {
            const snap = await db.ref('libis/state').once('value');
            const fbState = sanitizeState(snap.val());
            if (fbState && fbState.menu) {
                state = fbState;
                localStorage.setItem('libis_final', JSON.stringify(state));
            }
        } catch(e) {
            console.warn('לא הצלחתי לטעון מפיירבייס, עובד עם נתונים מקומיים');
        }
        render();

        // מאזין לשינויים ממכשירים אחרים בזמן אמת
        db.ref('libis/state').on('value', snap => {
            if (_fbSaving) return; // מונע לולאה — השינוי שלנו עצמנו
